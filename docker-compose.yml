services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      - api
volumes:
  uploads:
